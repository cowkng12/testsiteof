<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zire — Связаться с нами</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="contact-page">
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a class="logo" href="index.html" aria-label="Zire — главная">Zire</a>
                <nav class="nav" aria-label="Основная навигация">
                    <a href="contact.html" class="nav-link">Связаться с нами</a>
                    <a href="index.html#menu" class="nav-link">Меню</a>
                    <a href="index.html#promotions" class="nav-link">Акции</a>
                    <a href="index.html#vacancies" class="nav-link">Вакансии</a>
                    <a href="index.html#branches" class="nav-link">Филиалы</a>
                </nav>
                <div class="header-right">
                    <a href="https://wa.me/996990709709" target="_blank" rel="noopener" class="phone-link">+996 99 070 97 09</a>
                    <button class="icon-btn theme-toggle" id="themeToggle" aria-label="Переключить тему">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line></svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section class="about-section">
            <div class="container about-layout">
                <div class="about-copy">
                    <h1 class="about-title">Связаться с нами</h1>
                    <p class="about-description">Если у вас есть вопросы, предложения или пожелания, пожалуйста, свяжитесь с нами!</p>
                    <p class="about-description">Заполните форму ниже, и мы свяжемся с вами в кратчайшие сроки.</p>
                </div>

                <div class="contact-socials" aria-label="Наши контакты">
                    <a class="contact-social-card" href="https://www.instagram.com/zire_osh/" target="_blank" rel="noopener">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle></svg>
                        <span>Instagram</span>
                    </a>
                    <a class="contact-social-card" href="https://wa.me/996990709709" target="_blank" rel="noopener">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4A8 8 0 1 1 20 11.5Z"></path><path d="M8.7 8.7c.3-.4.6-.4.9-.1l1 1c.2.2.2.5 0 .8l-.4.5c.6 1.1 1.4 1.9 2.5 2.5l.5-.4c.3-.2.6-.2.8 0l1 1c.3.3.3.6-.1.9-.5.5-1.2.7-1.8.5-2.5-.8-4.4-2.7-5.2-5.2-.2-.6 0-1.3.5-1.8Z"></path></svg>
                        <span>+996 99 070 97 09</span>
                    </a>
                </div>

                <form class="about-form" id="aboutForm">
                    <label><span>Имя <b>*</b></span><input name="name" type="text" required placeholder="Ваше имя"></label>
                    <label><span>Номер телефона <b>*</b></span><input name="phone" type="tel" required placeholder="+996 ..."></label>
                    <label><span>Сообщение <b>*</b></span><textarea name="message" required placeholder="Напишите свой вопрос"></textarea></label>
                    <button type="submit" class="about-submit">Отправить</button>
                </form>
            </div>
        </section>
    </main>

    <div id="toastNotification" class="toast-notification">Спасибо за обращение!</div>
    <script>
        const themeToggle = document.getElementById('themeToggle');
        const form = document.getElementById('aboutForm');
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-theme');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            localStorage.setItem('theme', document.body.classList.contains('dark-theme') ? 'dark' : 'light');
        });
        form.addEventListener('submit', (event) => {
            event.preventDefault();
            form.reset();
            const toast = document.getElementById('toastNotification');
            toast.classList.remove('show');
            requestAnimationFrame(() => toast.classList.add('show'));
            window.setTimeout(() => toast.classList.remove('show'), 3000);
        });
    </script>
</body>
</html>
